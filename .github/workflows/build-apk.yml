name: Build Marvel TV Launcher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install Dependencies & Build Web UI
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build

      - name: Add Android Platform & Build APK
        run: |
          npx @capacitor/cli init "Marvel TV Launcher" "com.kushagra.marveltvlauncher" --web-dir dist || true
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Marvel-TV-Launcher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
